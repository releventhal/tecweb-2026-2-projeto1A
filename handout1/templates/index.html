<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Get-it</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/getit.css" />
  </head>

  <body>
    <header class="appbar">
      <img
        src="/img/logo-getit.png"
        class="logo"
        alt="Logotipo do Get-it"
      />
      <span class="subtitle">Como o Post-it, mas com outro verbo</span>
    </header>

    <main class="container">
      {error}

      <form class="form-card" action="/" method="POST">
        <input
          class="form-card-title"
          type="text"
          name="titulo"
          value="{form_title}"
          placeholder="Título"
        />

        <textarea
          class="autoresize"
          name="detalhes"
          placeholder="Digite o conteúdo..."
        >{form_details}</textarea>

        <button class="btn" type="submit">Criar</button>
      </form>

      <section class="card-container">
        {notes}
      </section>
    </main>

    <script src="/getit.js"></script>
  </body>
</html>
