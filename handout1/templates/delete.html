<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Excluir anotação</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />

    <link rel="preconnect" href="https://fonts.gstatic.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/getit.css" />
  </head>

  <body>
    <header class="appbar">
      <img
        src="/img/logo-getit.png"
        class="logo"
        alt="Logotipo do Get-it"
      />
      <span class="subtitle">Excluir anotação</span>
    </header>

    <main class="container">
      <div class="form-card delete-confirmation">
        <h1>Excluir “{title}”?</h1>

        <form class="delete-actions" action="/delete/{id}" method="POST">
          <a class="btn cancel-button" href="/">Não</a>

          <button class="btn delete-button" type="submit">
            Sim
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
